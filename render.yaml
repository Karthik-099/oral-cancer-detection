# Render blueprint for the OralAID backend (the web app itself is on Netlify).
# After the first deploy, set ORALAID_API_ORIGIN in Netlify to this service's URL.
services:
  - type: web
    name: oralaid-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: standard            # inference needs >= 2 GB RAM
    healthCheckPath: /api/health
    branch: prod
    autoDeploy: true
    envVars:
      - key: ORALAID_SECRET_KEY
        generateValue: true
      - key: ORALAID_CORS_ORIGINS
        value: https://oralaid.ai,https://www.oralaid.ai
      - key: ORALAID_SERVE_FRONTEND
        value: "0"
      - key: ORALAID_CLASSIFIER_URL
        sync: false           # signed URL to the checkpoint; never commit weights
      - key: DATABASE_URL
        fromDatabase: { name: oralaid-db, property: connectionString }
    disk:
      name: oralaid-data
      mountPath: /data
      sizeGB: 10

databases:
  - name: oralaid-db
    plan: basic-256mb
