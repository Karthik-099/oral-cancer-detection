# Netlify configuration for the OralAID web app (frontend/).
#
# Site environment variables (Site configuration -> Environment variables):
#   ORALAID_ONNX_URL     URL of oralnet-b4.onnx (e.g. a private Hugging Face repo "resolve" link)
#   HF_TOKEN             read token, only if that repo is private
#   SITE_URL             https://oral-cancer-detect.netlify.app
#   ORALAID_API_ORIGIN   optional, later: backend URL for accounts (proxied at /api and /files)
#
# The API is proxied through Netlify so the browser only talks to your domain:
# no CORS, the backend origin stays private, and static assets come from
# Netlify's global CDN with long-lived immutable caching.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Production branch is "prod" (set it under Site settings -> Build & deploy ->
# Branches). Every other branch and pull request gets a deploy preview.

[context.deploy-preview]
  command = "npm ci && npm run build"

# ── Caching (CDN) ───────────────────────────────────────────────────────────
# Hashed build assets never change: cache for a year at the edge and in browsers.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate so new deploys show up immediately.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# On-device model: shard names contain the model hash, so they never change.
[[headers]]
  for = "/model/*.bin"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/model/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/ort/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Clinical images and API responses are private: never cache at the CDN.
[[headers]]
  for = "/files/*"
  [headers.values]
    Cache-Control = "private, no-store"
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# ── Security headers ───────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-2K2feoalFjARBBFhyb3zCrfyNVJmqro8yIrkNQdQKOE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Redirects are generated at build time into dist/_redirects by
# frontend/scripts/postbuild.mjs (API proxy + SPA fallback).
