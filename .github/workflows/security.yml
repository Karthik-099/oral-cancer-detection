name: Security

on:
  push:
    branches: [main, prod]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # weekly, catches newly published CVEs
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  sast:
    name: SAST (bandit) + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install bandit==1.8.0 pip-audit==2.7.3
      - name: Bandit
        run: bandit -r oralaid_app/app_fastapi.py oralaid_app/security.py oralaid_app/inference -ll
      - name: pip-audit
        run: pip-audit -r oralaid_app/requirements-api.txt --extra-index-url https://download.pytorch.org/whl/cpu --progress-spinner off
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm ci --no-fund && npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read, actions: read }
    strategy:
      matrix: { language: [python, javascript-typescript] }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: "${{ matrix.language }}", queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  container:
    name: Image scan (Trivy) + DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t oralaid:scan .
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: oralaid:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif, category: trivy }
      - name: Start API for DAST
        run: |
          docker run -d -p 8000:8000 -e ORALAID_SECRET_KEY=dast-only-secret-0123456789abcdef \
            -e ORALAID_CORS_ORIGINS=http://localhost:8000 -e ORALAID_PUBLIC_DOCS=1 oralaid:scan
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 2; done
      - name: ZAP API scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: http://localhost:8000/openapi.json
          format: openapi
          fail_action: false
          allow_issue_writing: false
