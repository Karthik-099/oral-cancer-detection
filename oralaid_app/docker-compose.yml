version: '3.9'

services:

  oralaid:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oralaid_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-oralaid-prod-secret-2024}
      - DATABASE_URL=postgresql://oralaid:oralaid123@postgres:5432/oralaid
      - LOG_LEVEL=INFO
      - CLASSIFIER_PATH=/app/models/final_efficientnet_b4_oral_cancer.pth
      - SEGMENTER_PATH=/app/models/unet_segmenter.pth
    volumes:
      - oralaid_uploads:/app/uploads
      - ../models:/app/models:ro
      - oralaid_annotations:/app/static/annotations
      - oralaid_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oralaid_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/metrics')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  postgres:
    image: postgres:15-alpine
    container_name: oralaid_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=oralaid
      - POSTGRES_USER=oralaid
      - POSTGRES_PASSWORD=oralaid123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oralaid_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oralaid"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: oralaid_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./devops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - oralaid_net

  grafana:
    image: grafana/grafana:10.2.0
    container_name: oralaid_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/oralaid.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./devops/monitoring/grafana_provisioning.yml:/etc/grafana/provisioning/dashboards/provisioning.yml:ro
      - ./devops/monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/oralaid.json:ro
      - ./devops/monitoring/grafana_datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    networks:
      - oralaid_net

  nginx:
    image: nginx:1.25-alpine
    container_name: oralaid_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./devops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - oralaid
    networks:
      - oralaid_net

volumes:
  oralaid_uploads:
  oralaid_annotations:
  oralaid_logs:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  oralaid_net:
    driver: bridge
