name: Load test

# Run by hand against staging or the Oracle VM. Don't point stress/spike at
# production without warning users first.
on:
  workflow_dispatch:
    inputs:
      base_url: { description: "Target base URL", required: true }
      profile:
        description: "k6 profile"
        type: choice
        options: [smoke, load, stress, spike]
        default: load
      locust_users: { description: "Locust concurrent users", default: "50" }
      locust_duration: { description: "Locust duration", default: "5m" }

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: k6
        run: |
          docker run --rm -v "$PWD/loadtests:/scripts:ro" -e BASE_URL="${{ inputs.base_url }}" \
            -e PROFILE="${{ inputs.profile }}" grafana/k6:0.55.0 run /scripts/k6.js

  locust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install locust==2.32.4 numpy pillow
      - name: Locust (mixed browse + analyse)
        run: |
          mkdir -p results
          locust -f loadtests/locustfile.py --host "${{ inputs.base_url }}" --headless \
            -u "${{ inputs.locust_users }}" -r 5 -t "${{ inputs.locust_duration }}" \
            --csv results/locust --html results/locust.html
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: locust-report, path: results/ }
